services:
  postgres:
    image: postgres:15-alpine
    container_name: mediscope_db
    environment:
      POSTGRES_USER: mediscope_user
      POSTGRES_PASSWORD: mediscope_password
      POSTGRES_DB: mediscope
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4
    container_name: mediscope_pgadmin
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mediscope.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: mediscope_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
  kafka-ui:
      image: provectuslabs/kafka-ui:latest
      container_name: mediscope_kafka_ui
      ports:
        - "8090:8080"
      environment:
        - DYNAMIC_CONFIG_ENABLED=true
        - KAFKA_CLUSTERS_0_NAME=MediGuard-Cluster
        - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      depends_on:
        - kafka

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: mediscope_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  mediscope_app:
        build: .
        container_name: mediscope_core
        depends_on:
          - postgres
          - kafka
        ports:
          - "8000:8000"
        volumes:
          - ./data:/app/data
          - ./src:/app/src
          - ./tests:/app/tests 
          - ./main.py:/app/main.py
        environment:
          - ENVIRONMENT=development
          - DB_HOST=postgres
          - DB_PORT=5432
          - DB_USER=mediscope_user
          - DB_PASSWORD=mediscope_password
          - DB_NAME=mediscope
          - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
        command: uvicorn src.api.main_api:app --host 0.0.0.0 --port 8000 --reload

  grafana:
    image: grafana/grafana:latest
    container_name: mediscope_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      TZ: "Europe/Istanbul"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - postgres

networks:
  default:
    name: mediscope_network
    external: true

volumes:
  pgdata:
  grafana_data: